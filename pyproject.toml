[tool.poetry]
name = "risk_adjustment_model"
version = "0.7.0"
authors = ["Phil Fehlinger <pjfehlinger@gmail.com>"]
description = "Python implementation of healthcare risk adjustment models"
readme = "README.md"
packages = [{include = "risk_adjustment_model", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pre-commit = "^3.6.2"
jupyterlab = "^4.4.8"

[tool.poetry.group.cms_validation]
optional = true

[tool.poetry.group.cms_validation.dependencies]
pandas = "^2.3"
numpy = "^2.4"
faker = "^30.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
